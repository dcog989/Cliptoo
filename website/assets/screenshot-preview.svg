<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1280 800"
  role="img"
  aria-label="Cliptoo hover previews: image thumbnail and link metadata"
>
  <title>Cliptoo hover previews</title>
  <defs>
    <linearGradient id="winbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d1d" />
      <stop offset="1" stop-color="#171717" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9eff" />
      <stop offset="1" stop-color="#1f4e9c" />
    </linearGradient>
    <clipPath id="scene"><rect x="778" y="214" width="448" height="212" rx="6" /></clipPath>
  </defs>

  <rect width="1280" height="800" fill="#121014" />

  <!-- Window -->
  <rect x="48" y="48" width="1184" height="704" rx="14" fill="url(#winbg)" stroke="#2a2a2a" stroke-width="2" />
  <rect x="48" y="48" width="1184" height="52" rx="14" fill="#121212" />
  <rect x="48" y="84" width="1184" height="16" fill="#121212" />
  <circle cx="88" cy="74" r="8" fill="#e4572e" />
  <circle cx="112" cy="74" r="8" fill="#ffc857" />
  <circle cx="136" cy="74" r="8" fill="#1f4e9c" />
  <text x="168" y="79" font-family="ui-monospace, monospace" font-size="14" fill="#636363">cliptoo</text>

  <g font-family="ui-monospace, monospace">
    <!-- Row 1: selected code clip -->
    <rect x="72" y="124" width="1136" height="74" fill="#282828" />
    <rect x="72" y="124" width="4" height="74" fill="#4c9eff" />
    <rect x="96" y="144" width="36" height="30" rx="6" fill="#121212" stroke="#2a2a2a" stroke-width="1.5" />
    <text x="114" y="164" text-anchor="middle" font-size="14" fill="#4c9eff">&lt;/&gt;</text>
    <text x="148" y="154" font-size="17" fill="#B4B4B4">cargo build --release -p cliptoo</text>
    <text x="148" y="178" font-size="13" fill="#636363">code snippet · Thu 09:41</text>

    <!-- Row 2: link -->
    <rect x="72" y="198" width="1136" height="74" fill="#1C1C1C" />
    <rect x="96" y="218" width="36" height="30" rx="6" fill="#121212" stroke="#2a2a2a" stroke-width="1.5" />
    <text x="114" y="238" text-anchor="middle" font-size="15" fill="#4c9eff">↗</text>
    <text x="148" y="228" font-size="17" fill="#4c9eff">github.com/dcog989/Cliptoo</text>
    <text x="148" y="252" font-size="13" fill="#636363">link · title fetched</text>

    <!-- Row 3: color -->
    <rect x="96" y="296" width="36" height="30" rx="6" fill="#121212" stroke="#2a2a2a" stroke-width="1.5" />
    <rect x="102" y="302" width="24" height="18" rx="4" fill="#4c9eff" stroke="#2a2a2a" stroke-width="1" />
    <text x="148" y="308" font-size="17" font-weight="700" fill="#E4E4E4">#4C9EFF</text>
    <text x="256" y="308" font-size="17" fill="#B4B4B4">· accent blue</text>
    <text x="148" y="332" font-size="13" fill="#636363">oklch(0.62 0.22 260)</text>

    <!-- Row 4: image — hovered -->
    <rect x="72" y="346" width="1136" height="74" fill="#222222" />
    <rect x="96" y="366" width="36" height="30" rx="6" fill="none" stroke="#2a2a2a" stroke-width="1.5" />
    <rect x="102" y="372" width="24" height="18" rx="3" fill="url(#sky)" />
    <circle cx="113" cy="378" r="3" fill="#ffc857" />
    <text x="148" y="376" font-size="17" fill="#E4E4E4">clip_2026-08-09.png</text>
    <text x="148" y="400" font-size="13" fill="#636363">PNG · 1.4 MB · 1280 × 800</text>
    <text x="1156" y="378" text-anchor="end" font-size="13" fill="#4c9eff">hover preview ▸</text>
  </g>

  <!-- Link metadata tooltip -->
  <rect x="688" y="120" width="420" height="94" rx="10" fill="#171717" stroke="#2a2a2a" stroke-width="2" />
  <rect x="706" y="138" width="40" height="40" rx="6" fill="#121212" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="726" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#1f4e9c">▤</text>
  <text x="760" y="152" font-family="ui-monospace, monospace" font-size="15" font-weight="700" fill="#E4E4E4">Cliptoo</text>
  <text x="760" y="170" font-family="ui-monospace, monospace" font-size="12" fill="#4c9eff">github.com/dcog989/Cliptoo</text>
  <text x="760" y="187" font-family="ui-monospace, monospace" font-size="11" fill="#636363">page title + favicon fetched in background</text>

  <!-- Image hover preview tooltip -->
  <rect x="762" y="196" width="480" height="300" rx="10" fill="#171717" stroke="#2a2a2a" stroke-width="2" />
  <rect x="762" y="196" width="480" height="34" rx="10" fill="#121212" />
  <rect x="762" y="214" width="480" height="16" fill="#121212" />
  <text x="780" y="219" font-family="ui-monospace, monospace" font-size="13" fill="#A1A1A1">clip_2026-08-09.png</text>
  <text x="1226" y="219" text-anchor="end" font-family="ui-monospace, monospace" font-size="14" fill="#636363">×</text>

  <g clip-path="url(#scene)">
    <rect x="778" y="214" width="448" height="212" fill="url(#sky)" />
    <circle cx="1030" cy="286" r="26" fill="#ffc857" stroke="#0d0d0d" stroke-width="2" />
    <polygon points="700,430 810,320 920,430" fill="#1f4e9c" stroke="#0d0d0d" stroke-width="2" />
    <circle cx="910" cy="470" r="130" fill="#2f9e63" stroke="#0d0d0d" stroke-width="2.5" />
    <circle cx="1120" cy="480" r="96" fill="#7a8c2e" stroke="#0d0d0d" stroke-width="2.5" />
    <rect x="1118" y="412" width="26" height="10" rx="2" fill="#ffc857" />
  </g>

  <text x="790" y="446" font-family="ui-monospace, monospace" font-size="12" fill="#636363">PNG · 1.4 MB · 1280 × 800</text>
  <g transform="translate(1150,438)" fill="none" stroke="#A1A1A1" stroke-width="2" stroke-linecap="round">
    <rect x="0" y="0" width="66" height="18" rx="9" fill="none" stroke="#A1A1A1" />
    <path d="M 6 9 H 60" />
    <circle cx="40" cy="9" r="6" fill="#242424" stroke="#A1A1A1" stroke-width="1.5" />
  </g>

  <!-- Tail to the hovered image row -->
  <polygon points="1002,496 1010,512 1018,496" fill="#171717" stroke="#2a2a2a" stroke-width="2" />

  <!-- Bottom toolbar -->
  <rect x="48" y="700" width="1184" height="52" fill="#121212" stroke="#2a2a2a" stroke-width="1.5" />
  <rect x="72" y="712" width="320" height="28" rx="14" fill="#242424" stroke="#2a2a2a" stroke-width="1.5" />
  <text x="96" y="731" font-family="ui-monospace, monospace" font-size="14" fill="#4c9eff">/</text>
  <text x="112" y="731" font-family="ui-monospace, monospace" font-size="14" fill="#A1A1A1">Search clip history…</text>
  <text x="376" y="731" font-family="ui-monospace, monospace" font-size="12" fill="#636363">Ctrl+K</text>
  <g transform="translate(1114,716)" fill="none" stroke="#4c9eff" stroke-width="2.5" stroke-linecap="round">
    <path d="M 2 0 H 30" />
    <path d="M 6 6 H 26" />
    <path d="M 10 12 H 22" />
  </g>
  <g transform="translate(1160,718)" fill="none" stroke="#B4B4B4" stroke-width="2.5" stroke-linecap="round">
    <path d="M 2 4 H 22" />
    <path d="M 2 10 H 22" />
    <path d="M 2 16 H 22" />
  </g>
</svg>