<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Cliptoo is a fast, native clipboard manager for KDE Plasma 6 on Wayland.">
    <meta name="theme-color" content="#f7faff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
    <title>Cliptoo</title>
    <link rel="icon" type="image/svg+xml" href="/logo-48.svg">
    <script>
    try {
      const storedTheme = window.localStorage.getItem("theme");
      if (storedTheme === "light" || storedTheme === "dark") {
        document.documentElement.dataset.theme = storedTheme;
      }
    } catch {
      delete document.documentElement.dataset.theme;
    }
    </script>
    <style>

    <link rel="stylesheet" href="css/printer.css" media="print">
    <style>
    /* Only what the scaffold cannot know: the brand mark it has no markup for,
       and linked badge images, which its reset makes block-level. */
    .site-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono, monospace);
      font-size: var(--text-2xl, 1.75rem);
    }

    .site-brand__mark {
      width: 2.5rem;
      height: 2.5rem;
    }

    .site-header--compact .site-brand {
      font-size: var(--text-lg, 1.125rem);
    }

    .site-header--compact .site-brand__mark {
      width: 1.75rem;
      height: 1.75rem;
    }

    main p a > img {
      display: inline-block;
      vertical-align: middle;
    }

    /* The scaffold tints the bar from the page colour, which makes them the
       same tone; the header sits a step darker but stays translucent. */
    .site-header {
      background-color: color-mix(in oklab, var(--color-header-bg, var(--color-surface)) 88%, transparent);
    }

    /* Scrolling down thins the bar further, so more of the page shows through. */
    .site-header--compact {
      background-color: color-mix(in oklab, var(--color-header-bg, var(--color-surface)) 72%, transparent);
    }

    .site-footer__inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-4, 1rem);
    }

    .site-footer__inner p {
      margin: 0;
    }

    .site-footer__inner > p:first-child {
      margin-inline-end: auto;
    }

    .site-footer__github {
      display: inline-flex;
      vertical-align: middle;
      color: var(--color-text-muted, inherit);
    }

    .site-footer__github:hover {
      color: var(--color-accent, inherit);
    }

    /* Links keep the slate hue, distinct from body text and from the brand. */
    main :where(a) {
      color: var(--color-link, inherit);
    }

    /* Titles lean towards the accent without leaving the text colour behind. */
    :where(h1, h2, h3, h4, h5, h6) {
      color: color-mix(in oklab, var(--color-text) 65%, var(--color-accent));
    }
    </style>
  </head>

    <main id="main" class="container flow">

    <footer class="site-footer no-print">

        <p>Cliptoo — a fast, native clipboard manager for KDE Plasma 6, built with Rust and Slint.</p>

        <a class="site-footer__github" href="https://github.com/dcog989/Cliptoo" rel="noopener">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false" fill="currentColor">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"

    <dialog class="lightbox" id="lightbox" aria-label="Screenshot preview">
      <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close">×</button>
      <img class="lightbox__image" id="lightbox-image" alt="">
    </dialog>

    <script>
    // Compact the site header while scrolling down; restore it on scroll up.
    const header = document.querySelector(".site-header");
    if (header) {
      const COMPACT_CLASS = "site-header--compact";
      const TOP_THRESHOLD = 8;
      let lastY = window.scrollY;
      let ticking = false;

      const updateHeader = () => {
        const y = window.scrollY;
        if (y <= TOP_THRESHOLD || y < lastY) {
          header.classList.remove(COMPACT_CLASS);
        } else if (y > lastY) {
          header.classList.add(COMPACT_CLASS);
        }
        lastY = y;
        ticking = false;
      };

      window.addEventListener(
        "scroll",
        () => {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(updateHeader);
        },
        { passive: true },
      );
    }

    // Theme toggle — cycles system → light → dark and persists the choice.
    const THEME_KEY = "theme";
    const THEME_ORDER = ["system", "light", "dark"];
    const THEME_LABELS = { system: "System", light: "Light", dark: "Dark" };
    const themeToggle = document.getElementById("theme-toggle");
    const darkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    const readStoredTheme = () => {
      try {
        const stored = window.localStorage.getItem(THEME_KEY);
        return stored === "light" || stored === "dark" ? stored : "system";
      } catch {
        return "system";
      }
    };

    const persistTheme = (theme) => {
      try {
        window.localStorage.setItem(THEME_KEY, theme);
        return true;
      } catch {
        return false;
      }
    };

    // Keep the browser/OS chrome color in step with the resolved background.
    const syncThemeColor = () => {
      const backgroundColor = getComputedStyle(document.body).backgroundColor;
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.removeAttribute("media");
        meta.setAttribute("content", backgroundColor);
      }
    };

    const nextTheme = (theme) => THEME_ORDER[(THEME_ORDER.indexOf(theme) + 1) % THEME_ORDER.length];

    const applyTheme = (theme) => {
      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
      } else {
        delete document.documentElement.dataset.theme;
      }
      if (themeToggle) {
        const hint = `Click to apply ${THEME_LABELS[nextTheme(theme)]} theme.`;
        themeToggle.dataset.mode = theme;
        themeToggle.title = hint;
        themeToggle.setAttribute("aria-label", hint);
      }
      syncThemeColor();
    };

    applyTheme(readStoredTheme());

    if (themeToggle) {
      themeToggle.addEventListener("click", () => {
        const next = nextTheme(document.documentElement.dataset.theme || "system");
        applyTheme(next);
        persistTheme(next);
      });
    }

    darkScheme.addEventListener("change", () => {
      if (!document.documentElement.dataset.theme) syncThemeColor();
    });

    // Center-focused carousel with autoplay and manual controls.
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const AUTOPLAY_INTERVAL = 5000;

    document.querySelectorAll("[data-carousel]").forEach((carousel) => {
      const viewport = carousel.querySelector(".carousel__viewport");
      const track = carousel.querySelector(".carousel__track");
      const slides = Array.from(carousel.querySelectorAll(".carousel__slide"));
      const toggle = carousel.querySelector("[data-carousel-toggle]");
      let index = 0;
      let timer = null;

      // Respect the user's motion preference by starting paused.
      let userPaused = reduceMotion.matches;

      // The carousel keeps the height of the first slide; taller screenshots
      // shrink to fit it, so the content below never moves. The size comes from
      // the image's own dimensions, not its layout box (slides load lazily).
      const fitViewport = () => {
        const first = slides[0];
        const image = first?.querySelector("img");
        const ratio = Number(image?.getAttribute("height")) / Number(image?.getAttribute("width"));
        if (!first || !Number.isFinite(ratio) || ratio <= 0) return;
        const width = first.getBoundingClientRect().width;
        viewport.style.setProperty("--carousel-cap", `${Math.round(width * ratio)}px`);
      };

      const render = () => {
        const active = slides[index];
        if (!active) return;
        const offset = active.offsetLeft - (viewport.clientWidth - active.offsetWidth) / 2;
        track.style.transform = `translateX(${-offset}px)`;
        slides.forEach((slide, i) => {
          slide.classList.toggle("is-active", i === index);
          if (i === index) {
            slide.removeAttribute("aria-hidden");
          } else {
            slide.setAttribute("aria-hidden", "true");
          }
        });
      };

      const goTo = (next) => {
        index = (next + slides.length) % slides.length;
        render();
      };

      const stop = () => {
        if (timer !== null) {
          window.clearInterval(timer);
          timer = null;
        }
      };

      const start = () => {
        stop();
        if (userPaused || slides.length < 2) return;
        timer = window.setInterval(() => goTo(index + 1), AUTOPLAY_INTERVAL);
      };

      const syncToggle = () => {
        carousel.classList.toggle("is-paused", userPaused);
        toggle.setAttribute("aria-label", userPaused ? "Play slideshow" : "Pause slideshow");
      };

      carousel.querySelector("[data-carousel-prev]").addEventListener("click", () => {
        goTo(index - 1);
        start();
      });

      carousel.querySelector("[data-carousel-next]").addEventListener("click", () => {
        goTo(index + 1);
        start();
      });

      toggle.addEventListener("click", () => {
        userPaused = !userPaused;
        syncToggle();
        if (userPaused) {
          stop();
        } else {
          start();
        }
      });

      // Pause while the pointer or keyboard focus is inside the carousel.
      carousel.addEventListener("pointerenter", stop);
      carousel.addEventListener("pointerleave", start);
      carousel.addEventListener("focusin", stop);
      carousel.addEventListener("focusout", start);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stop();
        } else {
          start();
        }
      });

      reduceMotion.addEventListener("change", (event) => {
        userPaused = event.matches;
        syncToggle();
        start();
      });

      window.addEventListener("resize", () => {
        fitViewport();
        render();
      });

      fitViewport();
      syncToggle();
      render();
      start();
    });

    // Full-size popup for the screenshots the carousel shrinks to fit.
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");

    document.querySelector(".carousel")?.addEventListener("click", (event) => {
      const trigger = event.target.closest(".carousel__zoom");
      const image = trigger?.querySelector("img");
      if (!image || !lightbox || !lightboxImage) return;
      lightboxImage.src = image.currentSrc || image.src;
      lightboxImage.alt = image.alt;
      lightbox.showModal();
    });

    lightbox?.addEventListener("click", (event) => {
      if (event.target === lightbox || event.target.closest("[data-lightbox-close]")) lightbox.close();
    });
    </script>
  </body>
</html>
