[workspace]
resolver = "2"
members = [
  "src/core",
  "src/ui",
]

[workspace.package]
version = "2.20.0"
edition = "2024"
repository = "https://github.com/dcog989/Cliptoo"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.13", features = ["global_shortcuts", "tokio"] }
cc = "1"
chrono = "0.4"
const-hex = "1"
csscolorparser = "0.9"
dirs = "7"
evdev = "0.13"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["avif-native", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
jxl-oxide = "0.12"
lru = "0.18"
palette = { version = "0.7", default-features = false, features = ["std"] }
pkg-config = "0.3"
regex = "1"
# `rustls-no-provider` leaves the crypto backend unset: src/ui/src/main.rs
# installs one from the `rustls` entry below, so both must resolve to the same
# rustls version or `Client::build()` panics at runtime.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
resvg = "0.48"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slint = { version = "1.18", features = ["backend-qt"] }
slint-build = "1.18"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
which = "8"
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
# No debuginfo either way; the 118k-entry symbol table only adds package weight.
# Release panic traces are address-only once stripped.
strip = "symbols"

[profile.dev]
debug = "limited"

# The `bundled` SQLite is compiled by the `cc` crate using the profile's opt
# level. At the dev default (0) FTS5 prefix queries are several times slower,
# which makes search feel broken in a debug build. Optimise SQLite only; the
# rest of the dev profile stays unoptimised for fast rebuilds.
[profile.dev.package."libsqlite3-sys"]
opt-level = 3
