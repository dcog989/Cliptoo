[workspace]
resolver = "2"
members = [
  "src/core",
  "src/ui",
]

[workspace.package]
version = "2.16.0"
edition = "2024"
repository = "https://github.com/dcog989/Cliptoo"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.13", features = ["global_shortcuts", "tokio"] }
cc = "1"
chrono = "0.4"
const-hex = "1"
csscolorparser = "0.8"
dirs = "7"
evdev = "0.13"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
jxl-oxide = "0.12"
lru = "0.18"
pkg-config = "0.3"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
resvg = "0.48"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
slint = { version = "1.17", features = ["backend-qt"] }
slint-build = "1.17"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
which = "8"
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.dev]
debug = "limited"
