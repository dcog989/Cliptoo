name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Fmt + Clippy + Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Qt6 + Wayland)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-wayland libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  build-packages:
    name: Build Linux packages
    runs-on: ubuntu-24.04
    needs: check
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-wayland libwayland-dev \
            libxkbcommon-dev libfontconfig1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release -p cliptoo

      - name: Build .deb package
        run: cargo deb -p cliptoo --no-build

      - name: Build .rpm package
        run: cargo generate-rpm -p src/ui

      - name: Build AppImage
        env:
          QMAKE: /usr/bin/qmake6
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([0-9][0-9.]*\)"/\1/p' Cargo.toml | head -1)"
          APPDIR="$PWD/AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp target/release/cliptoo "$APPDIR/usr/bin/cliptoo"
          cp packaging/cliptoo.desktop "$APPDIR/usr/share/applications/cliptoo.desktop"
          cp src/ui/assets/cliptoo.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/cliptoo.svg"
          mkdir -p tools
          wget -q -O tools/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O tools/linuxdeploy-plugin-qt.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          wget -q -O tools/appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x tools/*.AppImage
          ./tools/linuxdeploy.AppImage --appdir "$APPDIR" --plugin qt
          ./tools/appimagetool.AppImage "$APPDIR" "$PWD/cliptoo-$VERSION-x86_64.AppImage"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            cliptoo-*.AppImage

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            packages/**/*.deb
            packages/**/*.rpm
            packages/**/*.AppImage
          draft: false
          prerelease: false
