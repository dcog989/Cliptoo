pre-commit:
  parallel: true
  commands:
    slint-format:
      run: just format-slint-staged {staged_files}
      glob: "*.slint"
    cargo-fmt-check:
      run: just format-check
      glob: "*.rs"
    biome-check:
      run: just biome-staged {staged_files}
      glob: "website/**/*.{html,css,js}"

commit-msg:
  commands:
    conventional-commits:
      # Merge/Revert lines bypass cog; everything else must pass cog verify.
      run: >-
        head -1 {1} |
        grep -qE '^(Merge |Revert )' ||
        just commit-check {1}

pre-push:
  parallel: true
  commands:
    cargo-test:
      run: just test
    cargo-clippy:
      run: just lint
