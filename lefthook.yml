pre-commit:
  parallel: true
  commands:
    slint-format:
      run: slint-lsp format -i {staged_files}
      glob: "*.slint"
    cargo-fmt-check:
      run: cargo fmt --all -- --check
      glob: "*.rs"
    cargo-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      glob: "*.rs"

commit-msg:
  commands:
    conventional-commits:
      # Subject must be `<type>(<scope>): <description>` (or a git Merge/Revert line).
      # types: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert
      run: >-
        head -1 {1} |
        grep -qE '^(Merge |Revert |(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+)' ||
        { echo "Commit message must follow Conventional Commits: <type>(<scope>): <description>" >&2; exit 1; }

pre-push:
  commands:
    cargo-test:
      run: cargo test --workspace
