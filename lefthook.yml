pre-commit:
  parallel: true
  commands:
    slint-format:
      run: slint-lsp format -i {staged_files}
      glob: "*.slint"
    cargo-fmt-check:
      run: cargo fmt --all -- --check
      glob: "*.rs"
    cargo-clippy:
      run: cargo clippy --workspace --all-targets -- -D warnings
      glob: "*.rs"
    biome-check:
      run: biome check {staged_files}
      glob: "website/**/*.{html,css,js}"

commit-msg:
  commands:
    conventional-commits:
      # Merge/Revert lines bypass cog; everything else must pass cog verify.
      run: >-
        head -1 {1} |
        grep -qE '^(Merge |Revert )' ||
        cog verify --file {1}

pre-push:
  commands:
    cargo-test:
      run: cargo test --workspace
